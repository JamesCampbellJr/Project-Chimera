plugins {
    id 'com.android.application'
}

android {
    namespace 'com.projectchimera.ridelistener'
    compileSdk 35

    defaultConfig {
        applicationId "com.projectchimera.ridelistener"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No external dependencies - uses only Android SDK
}
